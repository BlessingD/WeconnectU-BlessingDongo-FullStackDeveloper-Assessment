services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:80"

    volumes:
      - .:/var/www/html

    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: contact_assessment
      DB_USERNAME: contact_user
      DB_PASSWORD: contact_password

    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: contact_assessment
      MYSQL_USER: contact_user
      MYSQL_PASSWORD: contact_password
      MYSQL_ROOT_PASSWORD: root_password

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

volumes:
  mysql_data: